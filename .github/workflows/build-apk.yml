name: APK 빌드

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 패키지 설치
        run: npm ci

      - name: 웹 화면을 안드로이드 프로젝트에 복사
        run: npx cap sync android

      - name: APK 만들기
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 파일 이름 정리
        run: cp android/app/build/outputs/apk/debug/app-debug.apk daily-english.apk

      - name: Actions 결과물로 올리기
        uses: actions/upload-artifact@v4
        with:
          name: daily-english-apk
          path: daily-english.apk

      - name: 'Releases에 "최신 버전"으로 올리기 (휴대폰에서 바로 받기용)'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest daily-english.apk \
            --title "매일 영어회화 최신 버전" \
            --notes "휴대폰에서 daily-english.apk 를 눌러 내려받아 설치하세요."
