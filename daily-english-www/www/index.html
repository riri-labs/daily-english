<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff9f3">
<title>매일 영어회화</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff9f3; --card:#fff; --ink:#4b3f3c; --sub:#a0928b; --line:#f1e6dc;
  --blue:#6f9fcb; --blue-d:#4f7fae; --blue-s:#e4effa;
  --pink:#f7a8b8; --pink-d:#e0849a; --pink-s:#fde9ee;
  --green:#7ccb72; --green-d:#5aa851; --green-s:#e7f6e3;
  --red:#ff8a8a; --red-d:#e26464; --red-s:#ffeaea;
  --yellow:#ffd36e; --yellow-d:#e9b443; --yellow-s:#fff4d6;
  --r:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',sans-serif}
button{font-family:inherit;color:inherit}
.app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:90px}
.jua{font-family:'Jua','Noto Sans KR',sans-serif;font-weight:400}
.en{font-family:'Nunito','Noto Sans KR',sans-serif}
img.chr{display:block;object-fit:contain;pointer-events:none;user-select:none}

/* 상단 */
.top{position:sticky;top:0;z-index:6;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;gap:8px}
.top h1{flex:1;margin:0;font-size:21px}
.top .back{border:0;background:var(--card);width:38px;height:38px;border-radius:12px;font-size:18px;cursor:pointer;box-shadow:0 2px 0 var(--line)}
.chips{display:flex;gap:6px}
.chip{display:flex;align-items:center;gap:3px;font-family:'Nunito';font-weight:900;font-size:14px;background:var(--card);border-radius:999px;padding:5px 10px;box-shadow:0 2px 0 var(--line)}
.chip.fire{color:#f08a3c}.chip.xp{color:var(--blue-d)}
main{padding:4px 16px 20px}

/* 홈 인사 */
.hello{display:flex;align-items:flex-end;gap:6px;background:linear-gradient(160deg,var(--blue-s),#fff);border-radius:var(--r);padding:14px 14px 0;margin-bottom:14px;overflow:hidden;box-shadow:0 3px 0 var(--line)}
.hello img{width:118px;height:118px;margin-bottom:-6px}
.hello .bub{flex:1;background:#fff;border-radius:18px 18px 18px 4px;padding:12px 14px;margin-bottom:22px;font-size:14px;line-height:1.5;position:relative}
.hello .bub b{font-family:'Jua';font-size:17px;font-weight:400;display:block;margin-bottom:2px;color:var(--blue-d)}
.goal{background:var(--card);border-radius:18px;padding:12px 14px;margin-bottom:18px;display:flex;align-items:center;gap:12px;box-shadow:0 3px 0 var(--line)}
.goal .t{font-size:13px;color:var(--sub)}
.goal .t b{color:var(--ink);font-family:'Jua';font-weight:400;font-size:16px}
.pbar{height:12px;background:var(--line);border-radius:12px;overflow:hidden;margin-top:6px}
.pbar i{display:block;height:100%;background:var(--yellow);border-radius:12px;transition:width .4s}
.goal .gi{font-size:28px}

/* 학습 경로 */
.unit{border-radius:20px;padding:13px 16px;color:#fff;margin:6px 0 16px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.unit .jua{font-size:19px}
.unit small{display:block;font-size:12px;opacity:.9}
.path{display:flex;flex-direction:column;align-items:center;gap:26px;margin-bottom:26px;padding-top:30px;position:relative}
.node{position:relative;display:flex;flex-direction:column;align-items:center;cursor:pointer;border:0;background:none;padding:0}
.node .ci{width:74px;height:70px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;transition:transform .1s;position:relative}
.node:active .ci{transform:translateY(4px)}
.node .nm{font-family:'Jua';font-size:14px;margin-top:6px}
.node .st{font-size:12px;letter-spacing:1px;height:14px;color:var(--yellow-d)}
.node.cur .ci{animation:bob 1.6s ease-in-out infinite}
.node .start{position:absolute;top:-34px;background:#fff;border:2px solid var(--line);color:var(--blue-d);font-family:'Jua';font-size:13px;padding:3px 10px;border-radius:10px;white-space:nowrap;z-index:2}
.node .start::after{content:"";position:absolute;bottom:-7px;left:50%;margin-left:-6px;border:6px solid transparent;border-top-color:#fff;border-bottom:0}
.node .peek{position:absolute;width:76px;height:76px;top:-6px;z-index:3}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

/* 공용 */
.btn{border:0;border-radius:16px;padding:14px;font-family:'Jua';font-size:18px;cursor:pointer;width:100%;color:#fff;background:var(--blue);box-shadow:0 4px 0 var(--blue-d);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--blue-d)}
.btn.green{background:var(--green);box-shadow:0 4px 0 var(--green-d)}
.btn.red{background:var(--red);box-shadow:0 4px 0 var(--red-d)}
.btn.ghost{background:var(--card);color:var(--blue-d);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn:disabled{background:#e9e2dc;box-shadow:0 4px 0 #d8cfc7;color:#b5aaa2;cursor:default}
.row2{display:flex;gap:10px}
.card{background:var(--card);border-radius:18px;padding:14px;box-shadow:0 3px 0 var(--line)}
.empty{text-align:center;color:var(--sub);padding:20px 10px 30px;line-height:1.7}
.empty img{width:150px;height:150px;margin:0 auto 4px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:60;max-width:88%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 하단 탭 */
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.97);border-top:2px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:9}
nav .in{display:flex;max-width:520px;width:100%}
nav button{flex:1;border:0;background:none;padding:9px 0 11px;font-family:'Jua';font-size:13px;color:var(--sub);cursor:pointer}
nav button span{display:block;font-size:22px;margin-bottom:1px;filter:grayscale(1);opacity:.5}
nav button.on{color:var(--blue-d)}
nav button.on span{filter:none;opacity:1}

/* 바텀시트 (주제 메뉴) */
.sheet{position:fixed;inset:0;background:rgba(60,45,40,.4);z-index:30;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:.2s}
.sheet.show{opacity:1;pointer-events:auto}
.sheet .in{background:var(--bg);width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(40px);transition:.25s}
.sheet.show .in{transform:none}
.sheet h3{margin:0 0 4px;font-family:'Jua';font-weight:400;font-size:22px}
.sheet p{margin:0 0 14px;color:var(--sub);font-size:13px}
.sheet .btn{margin-bottom:10px}

/* 표현 목록 */
.seg{display:flex;background:var(--card);border-radius:14px;padding:4px;margin-bottom:12px;box-shadow:0 2px 0 var(--line)}
.seg button{flex:1;border:0;background:none;padding:10px;border-radius:10px;font-family:'Jua';font-size:15px;color:var(--sub);cursor:pointer}
.seg button.on{background:var(--blue);color:#fff}
.ph{background:var(--card);border-radius:16px;padding:13px 10px 13px 15px;margin-bottom:9px;display:flex;align-items:center;gap:6px;box-shadow:0 2px 0 var(--line)}
.ph .txt{flex:1;min-width:0;cursor:pointer}
.ph .e{font-size:16px;font-weight:800;line-height:1.4}
.ph .k{font-size:13.5px;color:var(--sub);margin-top:2px}
.ph .tip{font-size:12px;color:#b07a1c;margin-top:4px;background:var(--yellow-s);display:inline-block;padding:2px 8px;border-radius:6px}
.ib{border:0;background:var(--blue-s);color:var(--blue-d);width:38px;height:38px;border-radius:12px;font-size:16px;cursor:pointer;flex:none;position:relative}
.ib.mic{background:var(--pink-s)}
.ib.mic em{position:absolute;top:-6px;right:-6px;font-style:normal;font-size:10px;font-weight:900;background:var(--pink-d);color:#fff;border-radius:8px;padding:1px 4px;font-family:'Nunito'}
.ib.star{background:none;font-size:21px;color:#ddd3ca;width:30px}
.ib.star.on{color:var(--yellow)}

/* 롤플레이 */
.scene{font-size:13px;color:var(--sub);background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:12px;box-shadow:0 2px 0 var(--line)}
.roles{display:flex;gap:10px;margin-bottom:14px}
.roles button{flex:1;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:11px;font-family:'Jua';font-size:15px;cursor:pointer}
.roles button.on{border-color:var(--blue);color:var(--blue-d);background:var(--blue-s)}
.chat{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.who{font-size:12px;color:var(--sub);margin-bottom:3px}
.cb{max-width:86%;padding:12px 14px;border-radius:18px;line-height:1.45;font-size:15px}
.l{align-self:flex-start}.l .cb{background:var(--card);border-top-left-radius:6px;box-shadow:0 2px 0 var(--line)}
.r{align-self:flex-end}.r .who{text-align:right}.r .cb{background:var(--blue);color:#fff;border-top-right-radius:6px}
.cb .bk{font-size:13px;opacity:.75;margin-top:4px}
.cb .say{font-size:13px;margin-top:8px;font-weight:700}
.mini{border:0;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700;cursor:pointer;background:rgba(255,255,255,.25);color:#fff;margin-top:8px}
.l .mini{background:var(--blue-s);color:var(--blue-d)}

/* 플래시카드 */
.scope{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:none}
.scope::-webkit-scrollbar{display:none}
.scope button{flex:none;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer;color:var(--sub)}
.scope button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.prog{font-size:13px;color:var(--sub);text-align:center;margin-bottom:6px}
.fc-wrap{perspective:1200px;margin:6px 0 16px}
.fc{position:relative;height:300px;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;padding:22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:var(--card);box-shadow:0 4px 0 var(--line)}
.face.back{transform:rotateY(180deg);background:var(--blue);color:#fff;box-shadow:0 4px 0 var(--blue-d)}
.face .cl{position:absolute;top:14px;left:16px;font-size:12px;color:var(--sub);font-weight:700}
.face.back .cl{color:rgba(255,255,255,.75)}
.face .q{font-size:21px;font-weight:800;line-height:1.45}
.face .a{font-size:22px;font-weight:900;line-height:1.4}
.face .ak{font-size:14px;opacity:.85;margin-top:8px}
.pill{border:0;border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer;margin-top:14px}

/* 내 정보 */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--card);border-radius:16px;padding:12px;box-shadow:0 3px 0 var(--line);display:flex;align-items:center;gap:10px}
.stat .i{font-size:26px}
.stat b{display:block;font-family:'Nunito';font-size:20px;font-weight:900}
.stat span{font-size:12px;color:var(--sub)}
.week{display:flex;align-items:flex-end;gap:8px;height:110px;padding:6px 4px 0}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--sub)}
.week i{display:block;width:100%;border-radius:8px 8px 4px 4px;background:var(--blue-s);margin-bottom:4px;min-height:4px}
.week .today i{background:var(--blue)}
.set{display:flex;justify-content:space-between;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line);font-size:14px}
.set:last-child{border-bottom:0}
.opt{display:flex;gap:6px}
.opt button{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:5px 10px;font-weight:700;font-size:13px;cursor:pointer;color:var(--sub)}
.opt button.on{border-color:var(--blue);color:var(--blue-d);background:var(--blue-s)}
.sec{font-family:'Jua';font-size:17px;margin:16px 2px 8px}

/* ===== 레슨 화면 ===== */
.lesson{position:fixed;inset:0;background:var(--bg);z-index:40;display:none;flex-direction:column}
.lesson.show{display:flex}
.l-top{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 16px 6px;max-width:520px;width:100%;margin:0 auto}
.l-top .x{border:0;background:none;font-size:22px;color:var(--sub);cursor:pointer;padding:4px}
.l-top .pbar{flex:1;height:16px;margin:0}
.l-top .pbar i{background:var(--green);position:relative}
.l-top .pbar i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:4px;background:rgba(255,255,255,.4)}
.l-top .hp{font-family:'Nunito';font-weight:900;color:var(--red-d);font-size:16px;white-space:nowrap}
.l-body{flex:1;overflow-y:auto;padding:8px 18px 20px;max-width:520px;width:100%;margin:0 auto}
.qtype{font-family:'Jua';font-size:21px;margin:8px 0 12px}
.combo{display:inline-block;font-family:'Jua';font-size:13px;color:#f08a3c;background:var(--yellow-s);padding:2px 10px;border-radius:999px;margin-bottom:4px}
.guide{display:flex;align-items:center;gap:6px;margin-bottom:14px}
.guide img{width:96px;height:96px;flex:none}
.guide .sb{border:2px solid var(--line);border-radius:16px;padding:12px 14px;font-size:16px;line-height:1.5;position:relative;background:#fff;flex:1}
.guide .sb::before{content:"";position:absolute;left:-9px;top:22px;border:8px solid transparent;border-right-color:var(--line);border-left:0}
.guide .sb::after{content:"";position:absolute;left:-6px;top:23px;border:7px solid transparent;border-right-color:#fff;border-left:0}
.sb .ko{font-size:13px;color:var(--sub);margin-top:4px}
.sb .enq{font-weight:900;font-size:18px}
.blank{display:inline-block;min-width:64px;border-bottom:3px solid var(--blue);margin:0 3px;color:var(--blue-d);text-align:center;padding:0 4px}
.blank.fill{border-bottom-color:var(--green-d);color:var(--green-d)}
.blank.bad{border-bottom-color:var(--red-d);color:var(--red-d)}
.spk{border:0;background:var(--blue);color:#fff;border-radius:16px;width:64px;height:64px;font-size:28px;cursor:pointer;box-shadow:0 4px 0 var(--blue-d);flex:none}
.spk.slow{width:48px;height:48px;font-size:20px;background:var(--blue-s);color:var(--blue-d);box-shadow:0 4px 0 #c9dcef}
.listen{display:flex;gap:12px;align-items:flex-end;justify-content:center;margin:10px 0 20px}
.choices{display:grid;gap:10px}
.choices.two{grid-template-columns:1fr 1fr}
.ch{border:2px solid var(--line);background:#fff;border-radius:16px;padding:14px 12px;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 3px 0 var(--line);text-align:center;line-height:1.4}
.ch.sel{border-color:var(--blue);background:var(--blue-s);color:var(--blue-d);box-shadow:0 3px 0 #c9dcef}
.ch.ok{border-color:var(--green-d);background:var(--green-s);color:var(--green-d)}
.ch.no{border-color:var(--red-d);background:var(--red-s);color:var(--red-d)}
.ans{min-height:110px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding:6px 0 12px;margin-bottom:20px;background:repeating-linear-gradient(transparent 0 52px,var(--line) 52px 54px)}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{border:2px solid var(--line);background:#fff;border-radius:12px;padding:9px 13px;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.tile.used{background:var(--line);color:transparent;box-shadow:none}
.micbox{text-align:center;margin-top:10px}
.bigmic{width:88px;height:88px;border-radius:50%;border:0;background:var(--pink);color:#fff;font-size:36px;cursor:pointer;box-shadow:0 5px 0 var(--pink-d);margin:6px auto 8px;display:flex;align-items:center;justify-content:center}
.bigmic.on{background:var(--red);box-shadow:0 5px 0 var(--red-d);animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 5px 0 var(--red-d),0 0 0 0 rgba(255,138,138,.55)}70%{box-shadow:0 5px 0 var(--red-d),0 0 0 20px rgba(255,138,138,0)}100%{box-shadow:0 5px 0 var(--red-d),0 0 0 0 rgba(255,138,138,0)}}
.mst{font-size:13.5px;color:var(--sub);min-height:20px;line-height:1.5}
.mst .err{color:var(--red-d)}
.words{font-size:18px;font-weight:900;line-height:1.7;background:#fff;border-radius:14px;padding:10px 12px;margin-top:10px;box-shadow:0 2px 0 var(--line)}
.words .ok{color:var(--green-d)}.words .no{color:var(--red-d);text-decoration:underline wavy;text-underline-offset:4px}
.skip{border:0;background:none;color:var(--sub);font-size:13px;text-decoration:underline;cursor:pointer;margin-top:10px}
.l-foot{border-top:2px solid var(--line);padding:14px 18px calc(16px + env(safe-area-inset-bottom));background:var(--bg)}
.l-foot .in{max-width:520px;margin:0 auto}
.l-foot.ok{background:var(--green-s);border-top-color:transparent}
.l-foot.no{background:var(--red-s);border-top-color:transparent}
.fb{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.fb img{width:78px;height:78px;flex:none;margin:-14px 0 -6px}
.fb .h{font-family:'Jua';font-size:21px}
.l-foot.ok .h{color:var(--green-d)}.l-foot.no .h{color:var(--red-d)}
.fb .s{font-size:14px;margin-top:2px;line-height:1.45}
.fb .s b{font-family:'Nunito';font-weight:900}
.fb .tts{border:0;background:#fff;border-radius:10px;width:34px;height:34px;cursor:pointer;flex:none;margin-left:auto}
/* 결과 */
.res{text-align:center;padding:30px 18px;max-width:520px;margin:0 auto;width:100%;flex:1;overflow-y:auto}
.res img{width:200px;height:200px;margin:0 auto}
.res h2{font-family:'Jua';font-weight:400;font-size:28px;margin:6px 0 4px;color:var(--blue-d)}
.res .stars{font-size:38px;letter-spacing:4px;margin:4px 0 14px}
.res .stars .off{filter:grayscale(1);opacity:.3}
.rbox{display:flex;gap:10px;margin:0 0 22px}
.rbox div{flex:1;border-radius:16px;border:2px solid;padding:0 0 10px;overflow:hidden}
.rbox div span{display:block;color:#fff;font-family:'Jua';font-size:13px;padding:5px}
.rbox div b{display:block;font-family:'Nunito';font-size:22px;font-weight:900;margin-top:8px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:9px;height:14px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.sheet img.chr{width:84px;height:84px;flex:none}
</style>
</head>
<body>
<div class="app">
  <div class="top" id="top"></div>
  <main id="view"></main>
</div>
<nav><div class="in">
  <button data-tab="learn" class="on"><span>🏠</span>학습</button>
  <button data-tab="cards"><span>🃏</span>카드</button>
  <button data-tab="stars"><span>⭐</span>즐겨찾기</button>
  <button data-tab="me"><span>🐾</span>내 기록</button>
</div></nav>
<div class="sheet" id="sheet"></div>
<div class="lesson" id="lesson"></div>
<div class="toast" id="toast"></div>

<script>
/* ===================== 표현 데이터 ===================== */
const DATA = [
 {id:'greet',group:'daily',icon:'👋',title:'인사·스몰토크',
  phrases:[
   ["How's it going?","요즘 어때요? / 잘 지내요?","How are you?보다 가볍고 자연스러운 인사"],
   ["Long time no see!","오랜만이에요!"],
   ["What have you been up to?","그동안 뭐 하고 지냈어요?"],

let rec=null;
function listen(){
  return new Promise(async(resolve,reject)=>{
    const sr=CapP().SpeechRecognition;
    if(sr){try{
        const av=await sr.available();if(!av.available)return reject('unavailable');
        let perm=await sr.checkPermissions();if(perm.speechRecognition!=='granted')perm=await sr.requestPermissions();
        if(perm.speechRecognition!=='granted')return reject('not-allowed');
        const r=await sr.start({language:'en-US',maxResults:5,partialResults:false,popup:false});resolve((r&&r.matches)||[]);
      }catch(e){reject(String(e&&e.message||e))}return}
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return reject('unsupported');
    try{rec=new SR();rec.lang='en-US';rec.maxAlternatives=5;rec.interimResults=false;rec.continuous=false;let got=false;
      rec.onresult=ev=>{got=true;const out=[];for(const a of ev.results[0])out.push(a.transcript);resolve(out)};
      rec.onerror=ev=>reject(ev.error||'error');rec.onend=()=>{if(!got)reject('no-speech')};rec.start()}catch(e){reject('not-allowed')}
  });
}
function stopListen(){try{rec&&rec.stop()}catch(e){}try{CapP().SpeechRecognition&&CapP().SpeechRecognition.stop()}catch(e){}}

  return /not-allowed|denied|permission/i.test(m)?'마이크를 쓸 수 없어요. 앱의 마이크 권한을 허용해 주세요.'
   :/unsupported|unavailable/i.test(m)?'이 화면에서는 음성 인식이 안 돼요. 앱(APK)에서 해 주세요.'
   :/no-speech|No match|aborted/i.test(m)?'잘 안 들렸어요. 조금 더 크게 말해 볼까요?':'인식에 실패했어요. 다시 해 볼까요?'}

const NUM=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty'];
function norm(s){
  s=s.toLowerCase().replace(/[’‘]/g,"'").replace(/wi-fi/g,'wifi').replace(/o'clock|o clock/g,'oclock').replace(/%/g,' percent');
  s=s.replace(/can't/g,'can not').replace(/won't/g,'will not').replace(/n't/g,' not').replace(/'m/g,' am').replace(/'re/g,' are').replace(/'ll/g,' will').replace(/'ve/g,' have').replace(/'d/g,' would').replace(/(\w)'s/g,'$1 is');
  s=s.replace(/[^a-z0-9\s]/g,' ');
  return s.split(/\s+/).filter(Boolean).map(w=>/^\d+$/.test(w)&&+w<=20?NUM[+w]:w).map(w=>w==='cannot'?'can not':w).join(' ').split(' ').filter(Boolean);
}
function score(target,heard){
  const T=norm(target),H=norm(heard),m=T.length,n=H.length,dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)dp[i][j]=T[i]===H[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const hit=new Array(m).fill(false);let i=0,j=0;
  while(i<m&&j<n){if(T[i]===H[j]){hit[i]=true;i++;j++}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++}
  const ok=hit.filter(Boolean).length,extra=Math.max(0,n-ok);
  return{pct:Math.min(100,Math.max(0,Math.round(ok/m*100-extra*3))),T,hit,heard,H};
}
function best(target,list){let b=null;for(const h of list){const r=score(target,h);if(!b||r.pct>b.pct)b=r}return b}

const STOP=new Set('i you a an the is are am to for or and of in on at it its my me your we us be do can could would will this that there with please our he she his her him they them was were has have had so if but some any what how where when which who just let let\'s here\'s it\'s i\'m i\'ll i\'d you\'re that\'s what\'s'.split(' '));
function toks(s){return s.split(' ').map(raw=>{const m=raw.match(/^([^A-Za-z0-9']*)(.*?)([^A-Za-z0-9']*)$/);return{raw,pre:m[1],core:m[2],post:m[3],low:m[2].toLowerCase()}})}
function contentIdx(tk){return tk.map((t,i)=>(t.core.length>1&&!STOP.has(t.low)&&!/^[A-Z]-/.test(t.core))?i:-1).filter(i=>i>=0)}
const ALL=[];DATA.forEach(d=>d.phrases.forEach((p,i)=>ALL.push({cat:d,i,p,k:d.id+':'+i})));
const POOL=[...new Set(ALL.flatMap(x=>{const t=toks(x.p[0]);return contentIdx(t).map(i=>t[i].low)}))];
function distract(ans,n){const a=ans.toLowerCase();let c=POOL.filter(w=>w!==a&&Math.abs(w.length-a.length)<=3);if(c.length<n)c=POOL.filter(w=>w!==a);return shuffle(c).slice(0,n)}

   <div class="stats"><div class="stat"><span class="i">🔥</span><div><b>${curStreak()}</b><span>연속 학습일</span></div></div><div class="stat"><span class="i">💎</span><div><b>${xpTotal}</b><span>전체 XP</span></div></div>
   <div class="stat"><span class="i">📚</span><div><b>${lessons}</b><span>완료한 레슨</span></div></div><div class="stat"><span class="i">✅</span><div><b>${known.size}</b><span>외운 표현</span></div></div></div>
   <div class="sec">최근 7일 XP</div><div class="card"><div class="week">${days.map(d=>`<div class="${d.t?'today':''}"><i style="height:${(daily[d.k]||0)/mx*80}px"></i>${d.w}</div>`).join('')}</div></div>
   <div class="sec">설정</div><div class="card" style="padding:4px 14px">
    <div class="set">발음 속도<div class="opt"><button class="${rate<0.85?'on':''}" data-act="rate" data-v="0.7">천천히</button><button class="${rate>=0.85?'on':''}" data-act="rate" data-v="0.95">보통</button></div></div>
    <div class="set">하루 목표<div class="opt">${[20,30,50].map(v=>`<button class="${goal===v?'on':''}" data-act="goal" data-v="${v}">${v}XP</button>`).join('')}</div></div>
    <div class="set">효과음<div class="opt"><button class="${sound?'on':''}" data-act="sound" data-v="1">켜기</button><button class="${!sound?'on':''}" data-act="sound" data-v="0">끄기</button></div></div></div>`;
}

/* ===================== 레슨 (게임) ===================== */
let L=null;
const TYPES=['meaning','blank','listen','bank','blankSpeak','blank','bank','speak','listen','blankSpeak'];
function makeQ(type,x){
  const p=x.p,tk=toks(p[0]),q={type,x,p,tk};
  if(type==='blank'||type==='blankSpeak'){const ci=contentIdx(tk);q.bi=ci.length?pick(ci):tk.length-1;q.ans=tk[q.bi].core;
    if(type==='blank')q.choices=shuffle([q.ans.toLowerCase(),...distract(q.ans,3)])}
  if(type==='meaning'){q.dir=Math.random()<.5?'en2ko':'ko2en';const others=shuffle(ALL.filter(o=>o.k!==x.k)).slice(0,3);
    q.ans=q.dir==='en2ko'?p[1]:p[0];q.choices=shuffle([q.ans,...others.map(o=>q.dir==='en2ko'?o.p[1]:o.p[0])])}
  if(type==='listen'){const others=shuffle(ALL.filter(o=>o.k!==x.k)).slice(0,3);q.ans=p[1];q.choices=shuffle([p[1],...others.map(o=>o.p[1])])}
  if(type==='bank'){q.ans=tk.map(t=>t.core).filter(Boolean);const al=new Set(q.ans.map(w=>w.toLowerCase()));const ex=shuffle(POOL.filter(w=>!al.has(w)&&w.length<=6)).slice(0,2);q.tiles=shuffle([...q.ans.map((w,i)=>({w,id:'a'+i})),...ex.map((w,i)=>({w,id:'x'+i}))]);q.placed=[]}
  return q;
}
function startLesson(id){
  closeSheet();
  let pool=id==='review'?ALL.filter(x=>wrong.has(x.k)):ALL.filter(x=>x.cat.id===id);
  let seq=shuffle(pool);while(seq.length<TYPES.length)seq=seq.concat(shuffle(pool));
  // 긴 문장은 단어 조립에서 제외
  const qs=TYPES.map((t,i)=>{let x=seq[i];if(t==='bank'&&toks(x.p[0]).length>9){const alt=seq.find(s=>toks(s.p[0]).length<=9);if(alt)x=alt}return makeQ(t,x)});
  L={id,qs,i:0,hearts:5,correct:0,combo:0,maxCombo:0,total:qs.length,done:0,sel:null,state:'ask',retried:new Set(),tries:0,res:null,err:'',listening:false};
  $('#lesson').classList.add('show');drawL();
}
const qTitle={meaning:'알맞은 뜻을 골라요',blank:'빈칸에 들어갈 말을 골라요',listen:'듣고 알맞은 뜻을 골라요',bank:'단어를 순서대로 눌러 문장을 만들어요',blankSpeak:'빈칸을 채워서 문장 전체를 말해요',speak:'이 문장을 영어로 말해요'};
function blankHTML(q,state){
  return q.tk.map((t,i)=>i===q.bi?`${esc(t.pre)}<span class="blank ${state||''}">${state?esc(t.core):'&nbsp;'}</span>${esc(t.post)}`:esc(t.raw)).join(' ');
}
function drawL(){
  const q=L.qs[L.i],el=$('#lesson'),pct=L.done/L.total*100;
  if(L.state==='end'||L.state==='fail')return drawEnd();
  let body='',checkable=false;
  const ans=L.state!=='ask';
  if(q.type==='meaning'){
    body=`<div class="guide">${chr('study')}<div class="sb">${q.dir==='en2ko'?`<div class="enq en">${esc(q.p[0])}</div>`:`<div style="font-weight:700">${esc(q.p[1])}</div>`}</div></div>
     <div class="choices">${q.choices.map(c=>`<button class="ch ${q.dir==='ko2en'?'en':''} ${clsCh(c,q)}" data-act="pick" data-v="${esc(c)}">${esc(c)}</button>`).join('')}</div>`;checkable=L.sel!=null;
  }else if(q.type==='blank'){
    const st=ans?(L.ok?'fill':'bad'):'';
    body=`<div class="guide">${chr('study')}<div class="sb"><div class="enq en">${ans?blankHTML(q,st):blankHTML(q,L.sel?'':'').replace('&nbsp;',L.sel?esc(L.sel):'&nbsp;')}</div><div class="ko">${esc(q.p[1])}</div></div></div>
     <div class="choices two">${q.choices.map(c=>`<button class="ch en ${clsCh(c,q,true)}" data-act="pick" data-v="${esc(c)}">${esc(c)}</button>`).join('')}</div>`;checkable=L.sel!=null;
  }else if(q.type==='listen'){
    body=`<div class="listen"><button class="spk" data-act="say" data-t="${esc(q.p[0])}">🔊</button><button class="spk slow" data-act="sayslow" data-t="${esc(q.p[0])}">🐢</button></div>
     ${ans?`<div class="card en" style="text-align:center;font-weight:900;margin-bottom:14px">${esc(q.p[0])}</div>`:''}
     <div class="choices">${q.choices.map(c=>`<button class="ch ${clsCh(c,q)}" data-act="pick" data-v="${esc(c)}">${esc(c)}</button>`).join('')}</div>`;checkable=L.sel!=null;
  }else if(q.type==='bank'){
    const used=new Set(q.placed);
    body=`<div class="guide">${chr('study')}<div class="sb"><div style="font-weight:700">${esc(q.p[1])}</div></div></div>
     <div class="ans">${q.placed.map(id=>{const t=q.tiles.find(x=>x.id===id);return `<button class="tile en pop" data-act="unplace" data-id="${id}">${esc(t.w)}</button>`}).join('')}</div>
     <div class="bank">${q.tiles.map(t=>`<button class="tile en ${used.has(t.id)?'used':''}" data-act="place" data-id="${t.id}">${esc(t.w)}</button>`).join('')}</div>`;checkable=q.placed.length>0;
  }else{ // blankSpeak / speak
    const txt=q.type==='speak'?`<div class="enq en">${esc(q.p[0])}</div>`:`<div class="enq en">${ans?blankHTML(q,L.ok?'fill':'bad'):blankHTML(q)}</div>`;
    body=`<div class="guide">${chr('study')}<div class="sb">${txt}<div class="ko">${esc(q.p[1])}</div></div></div>
     ${q.type==='speak'?`<div style="text-align:center;margin-bottom:6px"><button class="spk slow" data-act="say" data-t="${esc(q.p[0])}">🔊</button></div>`:''}
     <div class="micbox">${L.res?`<div class="words en">${L.res.T.map((w,i)=>`<span class="${L.res.hit[i]?'ok':'no'}">${w}</span>`).join(' ')}</div><div class="mst" style="margin-top:6px">${L.res.pct}점 · 내가 한 말: “${esc(L.res.heard)}”</div>`:''}
      ${!ans?`<button class="bigmic ${L.listening?'on':''}" data-act="lmic">${L.listening?'🎙️':'🎤'}</button>
      <div class="mst">${L.err?`<span class="err">${L.err}</span>`:L.listening?'듣고 있어요… 말을 마치면 채점돼요':L.res?`조금 아쉬워요! 다시 말해 볼까요? (${L.tries}/3)`:'버튼을 누르고 말해 보세요'}</div>
      <button class="skip" data-act="lskip">지금은 말할 수 없어요</button>`:''}</div>`;
  }
  let foot='';
  if(L.state==='ask'){foot=(q.type==='blankSpeak'||q.type==='speak')?'':`<button class="btn green" data-act="check" ${checkable?'':'disabled'}>확인</button>`}
  else{const c=L.ok,full=q.p[0];
    foot=`<div class="fb pop">${chr(c?pick(['cheer','happy','laugh']):'worry')}<div><div class="h">${c?pick(['정답이에요!','완벽해요!','최고예요!','잘했어요!']):L.skipped?'다음에 말해 봐요':'아쉬워요!'}</div>
      <div class="s">${c?(L.combo>=3?`🔥 ${L.combo}연속 정답!`:'계속 이렇게만 가요~'):`정답: <b>${esc(full)}</b><br>${esc(q.p[1])}`}</div></div>
      <button class="tts" data-act="say" data-t="${esc(full)}">🔊</button></div><button class="btn ${c?'green':L.skipped?'':'red'}" data-act="cont">계속</button>`}
  el.innerHTML=`<div class="l-top"><button class="x" data-act="quit">✕</button><div class="pbar"><i style="width:${pct}%"></i></div><span class="hp">❤️ ${L.hearts}</span></div>
    <div class="l-body">${L.combo>=2&&L.state==='ask'?`<span class="combo">🔥 ${L.combo} COMBO</span>`:''}<div class="qtype">${qTitle[q.type]}</div>${body}</div>
    <div class="l-foot ${L.state==='ask'?'':L.ok?'ok':L.skipped?'':'no'}"><div class="in">${foot}</div></div>`;
  if(q.type==='listen'&&L.state==='ask'&&!L.played){L.played=true;setTimeout(()=>speak(q.p[0]),250)}
}
function clsCh(c,q,lower){
  if(L.state==='ask')return L.sel===c?'sel':'';
  const a=lower?q.ans.toLowerCase():q.ans;
  if(c===a)return 'ok';if(c===L.sel)return 'no';return '';
}
function judge(ok,opt={}){
  const q=L.qs[L.i];L.state='shown';L.ok=ok;L.skipped=!!opt.skip;
  if(opt.skip){L.combo=0}
  else if(ok){L.correct++;L.combo++;L.maxCombo=Math.max(L.maxCombo,L.combo);sfx.ok();wrong.delete(q.x.k)}
  else{L.hearts--;L.combo=0;sfx.no();wrong.add(q.x.k);
    if(!L.retried.has(L.i)){L.retried.add(L.i);L.qs.push(makeQ(q.type==='bank'?'blank':q.type,q.x));L.total++}
    document.querySelector('.l-body')&&document.querySelector('.l-body').classList.add('shake')}
  save();drawL();
  if(ok&&q.type!=='speak'&&q.type!=='blankSpeak')setTimeout(()=>speak(q.p[0]),200);
}
function check(){
  const q=L.qs[L.i];
  if(q.type==='bank'){const got=q.placed.map(id=>q.tiles.find(t=>t.id===id).w).join(' ').toLowerCase();judge(got===q.ans.join(' ').toLowerCase());return}
  if(q.type==='blank'){judge(L.sel===q.ans.toLowerCase());return}
  judge(L.sel===q.ans);
}
async function lmic(){
  if(L.listening){stopListen();return}
  const q=L.qs[L.i];try{speechSynthesis.cancel()}catch(e){}
  L.listening=true;L.err='';drawL();
  try{const list=await listen();if(!L)return;if(!list.length)throw 'no-speech';
    const r=best(q.p[0],list);L.res=r;L.tries++;hist[q.p[0]]=Math.max(r.pct,hist[q.p[0]]||0);
    let pass=r.pct>=60;
    if(q.type==='blankSpeak'){const need=norm(q.ans);pass=pass&&need.every(w=>r.H.includes(w))}
    L.listening=false;
    if(pass)judge(true);else if(L.tries>=3)judge(false);else{sfx.no();drawL()}
  }catch(e){if(!L)return;L.listening=false;L.err=micErr(e);drawL()}
}
function nextQ(){
  L.done++;L.i++;L.sel=null;L.state='ask';L.res=null;L.tries=0;L.err='';L.played=false;L.skipped=false;
  if(L.hearts<=0){L.state='fail';sfx.no()}else if(L.i>=L.qs.length){L.state='end';finish()}
  drawL();
}
function finish(){
  const acc=Math.round(L.correct/Math.max(1,L.done)*100),st=L.hearts>=5?3:L.hearts>=3?2:1;
  L.xp=10+L.correct*2+(L.maxCombo>=5?5:0);L.acc=acc;L.st=st;addXP(L.xp);
  if(L.id!=='review'){const p=prog[L.id]||{n:0,best:0};p.n++;p.best=Math.max(p.best,st);prog[L.id]=p}
  save();sfx.win();confetti();
}
function drawEnd(){
  const el=$('#lesson');
  if(L.state==='fail'){el.innerHTML=`<div class="res">${chr('worry')}<h2>하트를 다 썼어요</h2><p style="color:var(--sub)">괜찮아요! 틀린 표현은 복습 목록에 담아 뒀어요.</p>
    <button class="btn" data-act="retry" style="margin-bottom:12px">다시 도전하기</button><button class="btn ghost" data-act="quitok">나가기</button></div>`;return}
  el.innerHTML=`<div class="res">${chr(L.st===3?'laugh':'happy')}<h2>${L.st===3?'완벽한 레슨!':'레슨 완료!'}</h2>
    <div class="stars">${[1,2,3].map(n=>`<span class="${n<=L.st?'':'off'}">⭐</span>`).join('')}</div>
    <div class="rbox"><div style="border-color:var(--yellow)"><span style="background:var(--yellow)">획득 XP</span><b style="color:var(--yellow-d)">💎${L.xp}</b></div>
     <div style="border-color:var(--green)"><span style="background:var(--green)">정확도</span><b style="color:var(--green-d)">${L.acc}%</b></div>
     <div style="border-color:var(--pink)"><span style="background:var(--pink)">최대 콤보</span><b style="color:var(--pink-d)">🔥${L.maxCombo}</b></div></div>
    <button class="btn green" data-act="quitok">계속하기</button></div>`;
}
function confetti(){const c=document.createElement('div');c.className='confetti';const cols=['#6f9fcb','#f7a8b8','#ffd36e','#7ccb72','#c3a6ff'];
  for(let i=0;i<60;i++){const s=document.createElement('i');s.style.left=Math.random()*100+'%';s.style.background=pick(cols);s.style.animationDuration=(1.6+Math.random()*1.6)+'s';s.style.animationDelay=Math.random()*.5+'s';c.appendChild(s)}
  document.body.appendChild(c);setTimeout(()=>c.remove(),4000)}
function closeLesson(){stopListen();L=null;$('#lesson').classList.remove('show');$('#lesson').innerHTML='';render()}

/* ===================== 단독 말하기 연습 (표현 목록·롤플레이) ===================== */
let D=null;
function drill(target,ko,opt={}){D={target,ko,hide:!!opt.hide,cb:opt.cb,res:null,err:'',on:false};drawDrill();}
function drawDrill(){
  if(!D){closeSheet();return}
  const show=!D.hide||D.res;
  $('#sheet').innerHTML=`<div class="in" style="text-align:center"><div style="display:flex;align-items:center;gap:8px;text-align:left">${chr(D.res?(D.res.pct>=70?'cheer':'worry'):'study','')}<div><h3>🎤 말하기 채점</h3><p style="margin:0">${esc(D.ko)}</p></div></div>
   ${show&&!D.res?`<div class="card en" style="font-weight:900;font-size:18px;margin-top:10px">${esc(D.target)}</div>`:''}
   ${D.res?`<div style="font-family:Nunito;font-weight:900;font-size:46px;color:var(--blue-d);margin-top:6px">${D.res.pct}<span style="font-size:18px">점</span></div>
     <div class="words en">${D.res.T.map((w,i)=>`<span class="${D.res.hit[i]?'ok':'no'}">${w}</span>`).join(' ')}</div><div class="mst" style="margin-top:6px">내가 한 말: “${esc(D.res.heard)}”</div>`:''}
   <button class="bigmic ${D.on?'on':''}" data-act="dmic">${D.on?'🎙️':'🎤'}</button>
   <div class="mst">${D.err?`<span class="err">${D.err}</span>`:D.on?'듣고 있어요…':D.res?'눌러서 다시 도전':'버튼을 누르고 영어로 말해 보세요'}</div>
   <div class="row2" style="margin-top:14px"><button class="btn ghost" data-act="say" data-t="${esc(D.target)}">🔊 정답 듣기</button><button class="btn" data-act="dclose">${D.res?'완료':'닫기'}</button></div></div>`;
  $('#sheet').classList.add('show');
}
async function dmic(){
  if(D.on){stopListen();return}try{speechSynthesis.cancel()}catch(e){}
  D.on=true;D.err='';drawDrill();
  try{const list=await listen();if(!D)return;if(!list.length)throw 'no-speech';D.res=best(D.target,list);hist[D.target]=Math.max(D.res.pct,hist[D.target]||0);save();(D.res.pct>=70?sfx.ok:sfx.no)()}
  catch(e){if(!D)return;D.err=micErr(e)}
  if(D){D.on=false;drawDrill()}
}
function closeDrill(){stopListen();const r=D&&D.res,cb=D&&D.cb;D=null;closeSheet();if(cb)cb(r);else render()}

/* ===================== 이벤트 ===================== */
document.addEventListener('click',e=>{
  const n=e.target.closest('[data-tab]');
  if(n){S.tab=n.dataset.tab;S.cat=null;if(S.tab==='cards'&&!S.deck.length)buildDeck();render();window.scrollTo(0,0);return}
  if(e.target.id==='sheet'){D?closeDrill():closeSheet();return}
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  switch(a){
    case 'say':speak(b.dataset.t);break;
    case 'sayslow':speak(b.dataset.t,0.6);break;
    case 'back':S.cat=null;render();break;
    case 'unit':sfx.tap();openUnit(b.dataset.id);break;
    case 'go':startLesson(b.dataset.id);break;
    case 'review':startLesson('review');break;
    case 'openlist':closeSheet();S.tab='learn';S.cat=b.dataset.id;S.mode=b.dataset.m;S.step=0;S.rv={};render();window.scrollTo(0,0);break;
    case 'mode':S.mode=b.dataset.m;S.step=0;S.rv={};render();break;
    case 'star':{const k=b.dataset.k;stars.has(k)?(stars.delete(k),toast('즐겨찾기에서 뺐어요')):(stars.add(k),toast('⭐ 즐겨찾기에 담았어요'));save();render();break}
    case 'drill':{const f=findP(b.dataset.k);drill(f.p[0],f.p[1]);break}
    case 'dmic':dmic();break;
    case 'dclose':closeDrill();break;
    case 'role':S.role=+b.dataset.r;S.step=0;S.rv={};render();break;
    case 'next':{const ln=DATA.find(x=>x.id===S.cat).dialog.lines[S.step];S.step++;render();if(ln[0]!==S.role)speak(ln[1]);setTimeout(()=>window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}),30);break}
    case 'reveal':{const i=b.dataset.i;S.rv['d'+i]=1;render();speak(DATA.find(x=>x.id===S.cat).dialog.lines[i][1]);break}
    case 'rolemic':{const i=b.dataset.i,ln=DATA.find(x=>x.id===S.cat).dialog.lines[i];drill(ln[1],ln[2],{hide:true,cb:r=>{if(r){S.rv['d'+i]=1;S.rv['s'+i]=r.pct}render();setTimeout(()=>window.scrollTo({top:document.body.scrollHeight}),30)}});break}
    case 'restart':S.step=0;S.rv={};render();break;
    case 'swap':S.role=1-S.role;S.step=0;S.rv={};render();break;
    case 'scope':S.scope=b.dataset.s;buildDeck();render();break;
    case 'flip':if(e.target.closest('[data-act="say"]'))return;S.flip=!S.flip;render();if(S.flip)speak(findP(S.deck[S.pos]).p[0]);break;
    case 'got':known.add(S.deck[S.pos]);save();S.pos++;S.flip=false;render();break;
    case 'again':S.deck.push(S.deck[S.pos]);S.pos++;S.flip=false;render();break;
    case 'reshuffle':buildDeck();render();break;
    case 'starcards':S.tab='cards';S.scope='stars';buildDeck();render();break;
    case 'rate':rate=+b.dataset.v;save();render();speak('Nice to meet you!');break;
    case 'goal':goal=+b.dataset.v;save();render();break;
    case 'sound':sound=b.dataset.v==='1';save();render();sfx.tap();break;
    /* 레슨 */
    case 'pick':if(L.state!=='ask')return;sfx.tap();L.sel=b.dataset.v;drawL();break;
    case 'place':{const q=L.qs[L.i];if(L.state!=='ask'||q.placed.includes(b.dataset.id))return;sfx.tap();q.placed.push(b.dataset.id);drawL();break}
    case 'unplace':{const q=L.qs[L.i];if(L.state!=='ask')return;q.placed=q.placed.filter(x=>x!==b.dataset.id);drawL();break}
    case 'check':check();break;
    case 'lmic':lmic();break;
    case 'lskip':stopListen();judge(false,{skip:true});break;
    case 'cont':nextQ();break;
    case 'quit':if(L&&(L.state==='end'||L.state==='fail'))closeLesson();else{$('#lesson').querySelector('.l-foot .in').innerHTML=`<div class="fb">${chr('worry')}<div><div class="h" style="color:var(--ink)">정말 그만할까요?</div><div class="s">지금 나가면 이번 레슨 기록이 사라져요.</div></div></div><div class="row2"><button class="btn ghost" data-act="quitok">나가기</button><button class="btn" data-act="stay">계속하기</button></div>`}break;
    case 'stay':drawL();break;
    case 'quitok':closeLesson();break;
    case 'retry':{const id=L.id;closeLesson();startLesson(id);break}
  }
});
render();
</script>
</body>
</html>
