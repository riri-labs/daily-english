<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#2f6f62">
<title>매일 영어회화</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ec; --card:#ffffff; --ink:#1f2a28; --sub:#6b7672; --line:#e6e1d6;
  --main:#2f6f62; --main-soft:#e3efe9; --accent:#e9a23b; --accent-soft:#fbf0dc;
  --biz:#3d5a9e; --biz-soft:#e6ebf6; --danger:#c8553d;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',sans-serif}
body{min-height:100vh}
.app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:84px;position:relative}
.en{font-family:'Nunito','Noto Sans KR',sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:16px 18px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:20px;margin:0;font-weight:900;letter-spacing:-.5px;flex:1}
header h1 small{display:block;font-size:12px;font-weight:500;color:var(--sub);letter-spacing:0}
.back{border:0;background:var(--card);width:38px;height:38px;border-radius:12px;font-size:18px;cursor:pointer;box-shadow:0 1px 0 var(--line)}
.speed{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:12px;font-weight:700;color:var(--main);cursor:pointer;font-family:inherit}
main{padding:4px 18px 18px}
.hero{background:var(--main);color:#fff;border-radius:var(--r);padding:18px 18px 16px;margin-bottom:18px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero .lbl{font-size:12px;opacity:.8}
.hero .today{font-size:19px;font-weight:800;margin:6px 0 2px;line-height:1.35}
.hero .ko{font-size:14px;opacity:.85}
.hero .row{display:flex;gap:8px;margin-top:12px}
.pill{border:0;border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit}
.pill.light{background:rgba(255,255,255,.18);color:#fff}
.stats{display:flex;gap:10px;margin-bottom:18px}
.stat{flex:1;background:var(--card);border-radius:14px;padding:12px;text-align:center;box-shadow:0 1px 0 var(--line)}
.stat b{display:block;font-size:20px;font-family:'Nunito';color:var(--main)}
.stat span{font-size:12px;color:var(--sub)}
.sec{font-size:15px;font-weight:800;margin:6px 2px 10px;display:flex;align-items:center;gap:8px}
.sec .tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.cat{background:var(--card);border-radius:16px;padding:14px;cursor:pointer;border:0;text-align:left;font-family:inherit;color:inherit;box-shadow:0 1px 0 var(--line);transition:transform .12s}
.cat:active{transform:scale(.97)}
.cat .ic{font-size:24px}
.cat .t{font-weight:700;font-size:15px;margin:6px 0 2px}
.cat .c{font-size:12px;color:var(--sub)}
.bar{height:5px;background:var(--line);border-radius:5px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--main);border-radius:5px;transition:width .3s}
.cat.biz .bar i{background:var(--biz)}
.seg{display:flex;background:var(--card);border-radius:14px;padding:4px;margin-bottom:14px;box-shadow:0 1px 0 var(--line)}
.seg button{flex:1;border:0;background:none;padding:10px;border-radius:10px;font-weight:700;font-size:14px;color:var(--sub);cursor:pointer;font-family:inherit}
.seg button.on{background:var(--main);color:#fff}
.tools{display:flex;justify-content:space-between;align-items:center;margin:0 2px 10px;font-size:13px;color:var(--sub)}
.switch{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.switch i{width:38px;height:22px;border-radius:22px;background:var(--line);position:relative;transition:.2s}
.switch i::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch.on i{background:var(--main)}
.switch.on i::after{left:18px}
.ph{background:var(--card);border-radius:16px;padding:14px 12px 14px 16px;margin-bottom:9px;display:flex;align-items:center;gap:8px;box-shadow:0 1px 0 var(--line)}
.ph .txt{flex:1;min-width:0;cursor:pointer}
.ph .e{font-size:16px;font-weight:700;line-height:1.4}
.ph .k{font-size:13.5px;color:var(--sub);margin-top:3px;line-height:1.45}
.ph .tip{font-size:12px;color:var(--accent);margin-top:4px;background:var(--accent-soft);display:inline-block;padding:2px 8px;border-radius:6px}
.ph.known{opacity:.6}
.hidden-e{color:transparent!important;background:var(--main-soft);border-radius:6px;user-select:none}
.ib{border:0;background:var(--main-soft);color:var(--main);width:38px;height:38px;border-radius:12px;font-size:16px;cursor:pointer;flex:none}
.ib.star{background:none;font-size:20px;color:#c9c2b3;width:32px}
.ib.star.on{color:var(--accent)}
.chat{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.who{font-size:12px;color:var(--sub);margin-bottom:3px}
.bub{max-width:86%;padding:12px 14px;border-radius:18px;line-height:1.45;font-size:15px}
.l{align-self:flex-start}
.l .bub{background:var(--card);border-top-left-radius:6px;box-shadow:0 1px 0 var(--line)}
.r{align-self:flex-end;text-align:right}
.r .who{text-align:right}
.r .bub{background:var(--main);color:#fff;border-top-right-radius:6px;text-align:left}
.bub .bk{font-size:13px;opacity:.75;margin-top:4px}
.bub .say{font-size:13px;margin-top:8px;font-weight:700;opacity:.95}
.bub button{margin-top:8px}
.mini{border:0;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;background:rgba(255,255,255,.22);color:#fff}
.l .mini{background:var(--main-soft);color:var(--main)}
.big{width:100%;border:0;border-radius:16px;padding:15px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;background:var(--main);color:#fff}
.big.ghost{background:var(--card);color:var(--main);box-shadow:0 1px 0 var(--line)}
.roles{display:flex;gap:10px;margin-bottom:14px}
.roles button{flex:1;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px;font-family:inherit;font-weight:700;cursor:pointer;color:var(--ink);font-size:14px}
.roles button.on{border-color:var(--main);color:var(--main);background:var(--main-soft)}
.scene{font-size:13px;color:var(--sub);background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:12px;box-shadow:0 1px 0 var(--line)}
.fc-wrap{perspective:1200px;margin:6px 0 16px}
.fc{position:relative;height:300px;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;padding:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:var(--card);box-shadow:0 2px 0 var(--line),0 10px 30px rgba(47,111,98,.08)}
.face.back{transform:rotateY(180deg);background:var(--main);color:#fff}
.face .cl{position:absolute;top:16px;left:18px;font-size:12px;color:var(--sub);font-weight:700}
.face.back .cl{color:rgba(255,255,255,.7)}
.face .q{font-size:22px;font-weight:800;line-height:1.45}
.face .h{font-size:13px;color:var(--sub);margin-top:16px}
.face .a{font-size:23px;font-weight:800;line-height:1.4}
.face .ak{font-size:14px;opacity:.8;margin-top:10px}
.fc-btns{display:flex;gap:10px}
.fc-btns button{flex:1}
.again{background:var(--accent-soft)!important;color:#a26a12!important}
.scope{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:none}
.scope::-webkit-scrollbar{display:none}
.scope button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--sub)}
.scope button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.prog{font-size:13px;color:var(--sub);text-align:center;margin-bottom:6px}
.empty{text-align:center;color:var(--sub);padding:50px 20px;line-height:1.7}
.empty b{font-size:34px;display:block;margin-bottom:6px}
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:9}
nav .in{display:flex;max-width:520px;width:100%}
nav button{flex:1;border:0;background:none;padding:10px 0 12px;font-family:inherit;font-size:11.5px;font-weight:700;color:var(--sub);cursor:pointer}
nav button span{display:block;font-size:21px;margin-bottom:2px;filter:grayscale(1);opacity:.6}
nav button.on{color:var(--main)}
nav button.on span{filter:none;opacity:1}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:20;max-width:88%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.note{font-size:12.5px;color:var(--sub);background:var(--card);border-radius:12px;padding:12px 14px;line-height:1.6;margin-top:4px;box-shadow:0 1px 0 var(--line)}
.ib.mic-s{position:relative;background:var(--accent-soft);color:#a26a12}
.ib.mic-s em{position:absolute;top:-6px;right:-6px;font-style:normal;font-size:10px;font-weight:800;background:var(--accent);color:#fff;border-radius:8px;padding:1px 4px;font-family:'Nunito'}
.sheet{position:fixed;inset:0;background:rgba(20,30,28,.45);z-index:15;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:.2s}
.sheet.show{opacity:1;pointer-events:auto}
.sh-in{background:var(--bg);width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:18px 20px calc(22px + env(safe-area-inset-bottom));text-align:center;transform:translateY(30px);transition:.25s}
.sheet.show .sh-in{transform:none}
.sh-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sh-top .x{border:0;background:var(--card);width:34px;height:34px;border-radius:10px;cursor:pointer;font-size:14px}
.sh-ko{font-size:15px;color:var(--sub);margin-bottom:8px}
.sh-target{font-size:20px;font-weight:800;line-height:1.4;margin-bottom:6px}
.sh-hint{font-size:13px;color:var(--sub);background:var(--card);border-radius:10px;padding:8px;margin-bottom:6px}
.sh-score .num{font-family:'Nunito';font-size:54px;font-weight:800;color:var(--main);line-height:1}
.sh-score .pt{font-weight:800;color:var(--main);margin-left:2px}
.sh-msg{font-weight:700;margin:4px 0 12px}
.sh-words{font-size:19px;font-weight:800;line-height:1.7;background:var(--card);border-radius:14px;padding:10px 12px}
.sh-words .ok,.sh-legend .ok{color:#2f8a5a}
.sh-words .no,.sh-legend .no{color:var(--danger);text-decoration:underline wavy;text-underline-offset:4px}
.sh-heard{font-size:13px;color:var(--sub);margin-top:8px}
.sh-legend{font-size:11.5px;color:var(--sub);margin-top:4px}
.sh-legend .no{text-decoration:none}
.mic{width:74px;height:74px;border-radius:50%;border:0;background:var(--main);color:#fff;font-size:30px;cursor:pointer;margin:14px auto 6px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(47,111,98,.3)}
.mic.on{background:var(--danger);animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(200,85,61,.5)}70%{box-shadow:0 0 0 18px rgba(200,85,61,0)}100%{box-shadow:0 0 0 0 rgba(200,85,61,0)}}
.sh-st{font-size:13px;color:var(--sub);min-height:20px;line-height:1.5}
.sh-st .err{color:var(--danger)}
</style>
</head>
<body>
<div class="app">
  <header id="hdr"></header>
  <main id="view"></main>
</div>
<nav><div class="in">
  <button data-tab="home" class="on"><span>🏠</span>홈</button>
  <button data-tab="cards"><span>🃏</span>카드 연습</button>
  <button data-tab="stars"><span>⭐</span>즐겨찾기</button>
</div></nav>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

const store = {
  get(k,d){try{const v=localStorage.getItem('eng_'+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem('eng_'+k,JSON.stringify(v))}catch(e){}}
};
let stars = new Set(store.get('stars',[]));
let known = new Set(store.get('known',[]));
let rate = store.get('rate',0.9);

/* ===================== 음성 (발음 듣기) ===================== */
let voice=null;
function pickVoice(){
  try{
    const vs=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));
    voice = vs.find(v=>/en[-_]US/i.test(v.lang)&&/Google|Samantha|Aria|Jenny|Natural/i.test(v.name))
         || vs.find(v=>/en[-_]US/i.test(v.lang)) || vs[0] || null;
  }catch(e){}
}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
const CapP=()=>(window.Capacitor&&window.Capacitor.Plugins)||{};
function speak(text){
  const tts=CapP().TextToSpeech;
  if(tts){ tts.stop().catch(()=>{}).finally(()=>tts.speak({text,lang:'en-US',rate:rate,pitch:1}).catch(()=>toast('음성 재생에 실패했어요'))); return; }
  try{
    if(!('speechSynthesis' in window)) throw 0;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='en-US'; u.rate=rate; if(voice)u.voice=voice;
    speechSynthesis.speak(u);
  }catch(e){toast('이 브라우저에서는 음성 재생이 지원되지 않아요')}
}

/* ===================== 말하기 인식 ===================== */
let rec=null;
function listen(){
  return new Promise(async(resolve,reject)=>{
    const sr=CapP().SpeechRecognition;
    if(sr){ // APK(안드로이드 앱)
      try{
        const av=await sr.available(); if(!av.available) return reject('unavailable');
        let perm=await sr.checkPermissions();
        if(perm.speechRecognition!=='granted') perm=await sr.requestPermissions();
        if(perm.speechRecognition!=='granted') return reject('not-allowed');
        const r=await sr.start({language:'en-US',maxResults:5,partialResults:false,popup:false});
        resolve((r&&r.matches)||[]);
      }catch(e){reject(String(e&&e.message||e))}
      return;
    }
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR) return reject('unsupported');
    try{
      rec=new SR(); rec.lang='en-US'; rec.maxAlternatives=5; rec.interimResults=false; rec.continuous=false;
      let got=false;
      rec.onresult=ev=>{got=true;const out=[];for(const alt of ev.results[0])out.push(alt.transcript);resolve(out)};
      rec.onerror=ev=>reject(ev.error||'error');
      rec.onend=()=>{if(!got)reject('no-speech')};
      rec.start();
    }catch(e){reject('not-allowed')}
  });
}
function stopListen(){try{rec&&rec.stop()}catch(e){} try{CapP().SpeechRecognition&&CapP().SpeechRecognition.stop()}catch(e){}}

/* ===================== 채점 ===================== */
const NUM=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen','twenty'];
function norm(s){
  s=s.toLowerCase().replace(/[’‘]/g,"'").replace(/wi-fi/g,'wifi').replace(/o'clock|o clock/g,'oclock').replace(/%/g,' percent');
  s=s.replace(/can't/g,'can not').replace(/won't/g,'will not').replace(/n't/g,' not')
     .replace(/'m/g,' am').replace(/'re/g,' are').replace(/'ll/g,' will').replace(/'ve/g,' have').replace(/'d/g,' would')
     .replace(/(\w)'s/g,'$1 is');
  s=s.replace(/[^a-z0-9\s]/g,' ');
  return s.split(/\s+/).filter(Boolean).map(w=>/^\d+$/.test(w)&&+w<=20?NUM[+w]:w).map(w=>w==='cannot'?'can not':w).join(' ').split(' ');
}
// 원문 단어 기준으로 LCS 정렬 → 맞힌 단어 표시
function score(target,heard){
  const T=norm(target),H=norm(heard);
  const m=T.length,n=H.length,dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)dp[i][j]=T[i]===H[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const hit=new Array(m).fill(false);let i=0,j=0;
  while(i<m&&j<n){if(T[i]===H[j]){hit[i]=true;i++;j++}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++}
  const ok=hit.filter(Boolean).length, extra=Math.max(0,n-ok);
  const pct=Math.max(0,Math.round(ok/m*100-extra*3));
  return {pct:Math.min(100,pct),T,hit,heard};
}
function best(target,list){let b=null;for(const h of list){const r=score(target,h);if(!b||r.pct>b.pct)b=r}return b}
function verdict(p){return p>=90?['🎉','완벽해요!']:p>=70?['👍','잘했어요! 빠진 단어만 다시 확인해요']:p>=40?['💪','조금만 더! 들어보고 따라 해 봐요']:['🔁','다시 한번 천천히 말해 봐요']}
let hist=store.get('scores',{});
function saveScore(t,p){hist[t]=Math.max(p,hist[t]||0);store.set('scores',hist)}

/* 채점 시트 */
let SH=null; // {target, ko, hide, onDone}
function openSheet(target,ko,opt={}){SH={target,ko,hide:!!opt.hide,onDone:opt.onDone,state:'idle',res:null,err:''};drawSheet();}
function closeSheet(){stopListen();const r=SH&&SH.res;const cb=SH&&SH.onDone;SH=null;$('#sheet').classList.remove('show');if(cb)cb(r)}
function drawSheet(){
  const el=$('#sheet');if(!SH){el.classList.remove('show');return}
  const showT=!SH.hide||SH.res;
  let h=`<div class="sh-in"><div class="sh-top"><b>🎤 말하기 채점</b><button class="x" data-act="shclose">✕</button></div>
   <div class="sh-ko">${esc(SH.ko)}</div>`;
  if(SH.res){
    const r=SH.res,[ic,msg]=verdict(r.pct);
    h+=`<div class="sh-score"><span class="num">${r.pct}</span><span class="pt">점</span></div>
     <div class="sh-msg">${ic} ${msg}</div>
     <div class="sh-words en">${r.T.map((w,i)=>`<span class="${r.hit[i]?'ok':'no'}">${w}</span>`).join(' ')}</div>
     <div class="sh-heard">내가 한 말: <span class="en">“${esc(r.heard||'-')}”</span></div>
     <div class="sh-legend"><span class="ok">초록</span> 맞힌 단어 · <span class="no">빨강</span> 빠지거나 다르게 들린 단어</div>`;
  } else if(showT){
    h+=`<div class="sh-target en">${esc(SH.target)}</div>`;
  } else h+=`<div class="sh-hint">영어 문장은 채점 후에 보여 드려요</div>`;
  if(SH.state==='listening') h+=`<button class="mic on" data-act="shstop"><span>🎙️</span></button><div class="sh-st">듣고 있어요… 말을 마치면 자동으로 채점돼요</div>`;
  else {
    h+=`<button class="mic" data-act="shgo"><span>🎤</span></button><div class="sh-st">${SH.err?`<span class="err">${SH.err}</span>`:(SH.res?'눌러서 다시 도전':'버튼을 누르고 영어로 말해 보세요')}</div>`;
  }
  h+=`<div class="fc-btns" style="margin-top:14px"><button class="big ghost" data-act="say" data-t="${esc(SH.target)}">🔊 정답 듣기</button>
    <button class="big" data-act="shclose">${SH.res?'완료':'닫기'}</button></div></div>`;
  el.innerHTML=h;el.classList.add('show');
}
async function runSheet(){
  try{speechSynthesis.cancel()}catch(e){}
  SH.state='listening';SH.err='';drawSheet();
  try{
    const list=await listen(); if(!SH)return;
    if(!list.length) throw 'no-speech';
    SH.res=best(SH.target,list); saveScore(SH.target,SH.res.pct);
  }catch(e){
    if(!SH)return;
    const m=String(e);
    SH.err = /not-allowed|denied|permission/i.test(m)?'마이크를 사용할 수 없어요. APK 앱에서 마이크 권한을 허용해 주세요. (웹 화면에서는 마이크가 막혀 있어요)'
      : /unsupported|unavailable/i.test(m)?'이 화면에서는 음성 인식이 지원되지 않아요. APK 앱에서 사용해 주세요.'
      : /no-speech|No match|aborted/i.test(m)?'잘 안 들렸어요. 조금 더 크게 다시 말해 볼까요?'
      : '인식에 실패했어요. 다시 시도해 주세요.';
  }
  if(SH){SH.state='idle';drawSheet();}
}

/* ===================== 상태·도우미 ===================== */
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const key=(c,i)=>c+':'+i;
const findP=k=>{const[c,i]=k.split(':');const cat=DATA.find(d=>d.id===c);return cat&&cat.phrases[i]?{cat,i:+i,p:cat.phrases[i]}:null};
let S={tab:'home',cat:null,mode:'list',hideEn:false,role:1,step:0,revealed:{},scope:'all',deck:[],pos:0,flip:false};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800)}
const total=DATA.reduce((a,d)=>a+d.phrases.length,0);
function todayPhrase(){const all=[];DATA.forEach(d=>d.phrases.forEach((p,i)=>all.push({d,p})));const n=Math.floor(Date.now()/864e5);return all[n%all.length]}

/* ===================== 화면 그리기 ===================== */
function header(title,sub,back){
  $('#hdr').innerHTML=`${back?'<button class="back" data-act="back">←</button>':''}
   <h1>${title}${sub?`<small>${sub}</small>`:''}</h1>
   <button class="speed" data-act="speed">🔊 ${rate<0.85?'천천히':'보통'}</button>`;
}
function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  if(S.tab==='home') S.cat?renderCat():renderHome();
  else if(S.tab==='cards') renderCards();
  else renderStars();
  window.scrollTo(0,0);
}
function renderHome(){
  header('매일 영어회화','일상 · 응대 표현 연습');
  const t=todayPhrase();
  let h=`<div class="hero"><div class="lbl">오늘의 한 문장 · ${t.d.title}</div>
    <div class="today en">${esc(t.p[0])}</div><div class="ko">${esc(t.p[1])}</div>
    <div class="row"><button class="pill light" data-act="say" data-t="${esc(t.p[0])}">🔊 들어보기</button>
    <button class="pill light" data-act="gocards">🃏 카드 연습하기</button></div></div>
    <div class="stats"><div class="stat"><b>${known.size}</b><span>외운 표현</span></div>
    <div class="stat"><b>${total}</b><span>전체 표현</span></div>
    <div class="stat"><b>${stars.size}</b><span>즐겨찾기</span></div></div>`;
  for(const g of ['daily','biz']){
    h+=`<div class="sec">${GROUPS[g].name}<span class="tag" style="background:${GROUPS[g].soft};color:${GROUPS[g].color}">${g==='daily'?'Daily':'Business'}</span></div><div class="grid">`;
    DATA.filter(d=>d.group===g).forEach(d=>{
      const k=d.phrases.filter((_,i)=>known.has(key(d.id,i))).length;
      h+=`<button class="cat ${g}" data-act="open" data-id="${d.id}"><div class="ic">${d.icon}</div>
      <div class="t">${d.title}</div><div class="c">표현 ${d.phrases.length}개 · 롤플레이</div>
      <div class="bar"><i style="width:${k/d.phrases.length*100}%"></i></div></button>`;
    });
    h+='</div>';
  }
  h+=`<div class="note">💡 🔊로 발음을 듣고 🎤로 말하면 단어별로 채점해 드려요. 오른쪽 위 버튼으로 읽기 속도를 바꿀 수 있고, 점수·외운 표현·즐겨찾기는 이 기기에 저장돼요.</div>`;
  $('#view').innerHTML=h;
}
function renderCat(){
  const d=DATA.find(x=>x.id===S.cat);
  header(d.icon+' '+d.title,GROUPS[d.group].name,true);
  let h=`<div class="seg"><button class="${S.mode==='list'?'on':''}" data-act="mode" data-m="list">📖 표현</button>
    <button class="${S.mode==='role'?'on':''}" data-act="mode" data-m="role">🎭 롤플레이</button></div>`;
  if(S.mode==='list'){
    h+=`<div class="tools"><span>🔊 듣기 · 🎤 말하고 채점</span>
      <span class="switch ${S.hideEn?'on':''}" data-act="hide"><i></i>영어 가리기</span></div>`;
    d.phrases.forEach((p,i)=>{
      const k=key(d.id,i), rv=S.revealed[k];
      h+=phraseRow(p,k,S.hideEn&&!rv);
    });
    h+=`<button class="big ghost" style="margin-top:8px" data-act="catcards">🃏 이 주제로 카드 연습</button>`;
  } else {
    const dl=d.dialog;
    h+=`<div class="scene">🎬 ${esc(dl.scene)}</div>
     <div class="roles">${dl.roles.map((r,i)=>`<button class="${S.role===i?'on':''}" data-act="role" data-r="${i}">${i===S.role?'✔ ':''}내가 '${esc(r)}' 역할</button>`).join('')}</div>
     <div class="chat">`;
    dl.lines.slice(0,S.step).forEach((ln,i)=>{
      const mine=ln[0]===S.role, nm=dl.roles[ln[0]];
      const open=!mine||S.revealed['d'+i];
      h+=`<div class="${mine?'r':'l'}"><div class="who">${esc(nm)}${mine?' (나)':''}</div><div class="bub">`;
      if(open) h+=`<div class="en" style="font-weight:700">${esc(ln[1])}</div><div class="bk">${esc(ln[2])}</div>${mine&&S.revealed['s'+i]!=null?`<div class="say">🎤 ${S.revealed['s'+i]}점</div>`:''}
        <button class="mini" data-act="say" data-t="${esc(ln[1])}">🔊 듣기</button>`;
      else h+=`<div>${esc(ln[2])}</div><div class="say">🗣️ 영어로 소리 내어 말해 보세요</div>
        <button class="mini" data-act="rolemic" data-i="${i}">🎤 말하고 채점</button> <button class="mini" data-act="reveal" data-i="${i}">정답 보기</button>`;
      h+=`</div></div>`;
    });
    h+='</div>';
    if(S.step<dl.lines.length) h+=`<button class="big" data-act="next">${S.step===0?'▶ 대화 시작':'다음 대사 ▶'}</button>`;
    else h+=`<div class="empty" style="padding:16px"><b>🎉</b>대화 연습 완료!</div>
      <div class="fc-btns"><button class="big ghost" data-act="restart">처음부터</button>
      <button class="big" data-act="swap">역할 바꿔서 하기</button></div>`;
  }
  $('#view').innerHTML=h;
}
function phraseRow(p,k,hide){
  return `<div class="ph ${known.has(k)?'known':''}">
    <div class="txt" data-act="tap" data-k="${k}">
      <div class="e en ${hide?'hidden-e':''}">${esc(p[0])}</div>
      <div class="k">${esc(p[1])}</div>${p[2]?`<div class="tip">💡 ${esc(p[2])}</div>`:''}</div>
    <button class="ib" data-act="say" data-t="${esc(p[0])}" aria-label="발음 듣기">🔊</button>
    <button class="ib mic-s" data-act="mic" data-k="${k}" aria-label="말하기 채점">🎤${hist[p[0]]!=null?`<em>${hist[p[0]]}</em>`:''}</button>
    <button class="ib star ${stars.has(k)?'on':''}" data-act="star" data-k="${k}" aria-label="즐겨찾기">★</button></div>`;
}
function buildDeck(){
  let keys=[];
  DATA.forEach(d=>d.phrases.forEach((_,i)=>keys.push(key(d.id,i))));
  if(S.scope==='stars') keys=keys.filter(k=>stars.has(k));
  else if(S.scope==='unknown') keys=keys.filter(k=>!known.has(k));
  else if(S.scope!=='all') keys=keys.filter(k=>k.startsWith(S.scope+':'));
  for(let i=keys.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[keys[i],keys[j]]=[keys[j],keys[i]]}
  S.deck=keys;S.pos=0;S.flip=false;
}
function renderCards(){
  header('카드 연습','한국어를 보고 영어로 말해 보세요');
  const scopes=[['all','전체'],['unknown','못 외운 것'],['stars','⭐ 즐겨찾기'],...DATA.map(d=>[d.id,d.icon+' '+d.title])];
  let h=`<div class="scope">${scopes.map(s=>`<button class="${S.scope===s[0]?'on':''}" data-act="scope" data-s="${s[0]}">${s[1]}</button>`).join('')}</div>`;
  if(!S.deck.length){
    h+=`<div class="empty"><b>${S.scope==='stars'?'⭐':'🎉'}</b>${S.scope==='stars'?'즐겨찾기한 표현이 없어요.<br>표현 목록에서 ★를 눌러 추가해 보세요.':S.scope==='unknown'?'모든 표현을 외웠어요! 대단해요.':'카드가 없어요.'}</div>`;
  } else if(S.pos>=S.deck.length){
    h+=`<div class="empty"><b>👏</b>${S.deck.length}장 연습 완료!</div><button class="big" data-act="reshuffle">다시 섞어서 연습</button>`;
  } else {
    const f=findP(S.deck[S.pos]);
    h+=`<div class="prog">${S.pos+1} / ${S.deck.length}</div>
    <div class="fc-wrap"><div class="fc ${S.flip?'flip':''}" data-act="flip">
      <div class="face"><div class="cl">${f.cat.icon} ${f.cat.title}</div>
        <div class="q">${esc(f.p[1])}</div><div class="h">🎤 버튼을 눌러 영어로 말하면 채점해 드려요</div>
        <button class="pill" style="margin-top:14px;background:var(--main);color:#fff" data-act="cardmic">🎤 말하고 채점</button></div>
      <div class="face back"><div class="cl">${f.cat.icon} ${f.cat.title}</div>
        <div class="a en">${esc(f.p[0])}</div><div class="ak">${esc(f.p[1])}</div>
        <button class="pill light" style="margin-top:16px" data-act="say" data-t="${esc(f.p[0])}">🔊 발음 듣기</button></div>
    </div></div>
    ${S.flip?`<div class="fc-btns"><button class="big again" data-act="again">🔁 다시 볼래요</button><button class="big" data-act="got">✅ 알아요</button></div>`
      :`<button class="big" data-act="flip">정답 보기</button>`}`;
  }
  $('#view').innerHTML=h;
}
function renderStars(){
  header('즐겨찾기',`저장한 표현 ${stars.size}개`);
  if(!stars.size){$('#view').innerHTML=`<div class="empty"><b>⭐</b>아직 즐겨찾기한 표현이 없어요.<br>자주 쓰고 싶은 표현에 ★를 눌러 보세요.</div>`;return}
  let h='';
  [...stars].map(findP).filter(Boolean).forEach(f=>{h+=phraseRow(f.p,key(f.cat.id,f.i),false)});
  h+=`<button class="big ghost" style="margin-top:8px" data-act="starcards">🃏 즐겨찾기로 카드 연습</button>`;
  $('#view').innerHTML=h;
}

/* ===================== 이벤트 ===================== */
document.addEventListener('click',e=>{
  const n=e.target.closest('[data-tab]');
  if(n){S.tab=n.dataset.tab;S.cat=null;if(S.tab==='cards'&&!S.deck.length)buildDeck();render();return}
  if(e.target.id==='sheet'){closeSheet();return}
  const b=e.target.closest('[data-act]'); if(!b)return;
  const a=b.dataset.act;
  if(a!=='flip') e.stopPropagation();
  switch(a){
    case 'say': speak(b.dataset.t); break;
    case 'speed': rate=rate<0.85?0.95:0.7; save(); toast(rate<0.85?'천천히 읽어 줄게요 🐢':'보통 속도로 읽어 줄게요'); render(); break;
    case 'open': S.cat=b.dataset.id;S.mode='list';S.revealed={};S.step=0;render();break;
    case 'back': S.cat=null;render();break;
    case 'mode': S.mode=b.dataset.m;S.step=0;S.revealed={};render();break;
    case 'hide': S.hideEn=!S.hideEn;S.revealed={};render();break;
    case 'tap': {
      const k=b.dataset.k, f=findP(k);
      if(S.hideEn&&!S.revealed[k]){S.revealed[k]=1;render();}
      speak(f.p[0]);break;}
    case 'star': {const k=b.dataset.k; stars.has(k)?(stars.delete(k),toast('즐겨찾기에서 뺐어요')):(stars.add(k),toast('⭐ 즐겨찾기에 추가했어요')); save(); render(); break;}
    case 'role': S.role=+b.dataset.r;S.step=0;S.revealed={};render();break;
    case 'next': {
      const dl=DATA.find(x=>x.id===S.cat).dialog; const ln=dl.lines[S.step]; S.step++;
      render(); if(ln[0]!==S.role) speak(ln[1]);
      setTimeout(()=>window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}),30);break;}
    case 'reveal': {const i=b.dataset.i;S.revealed['d'+i]=1;const ln=DATA.find(x=>x.id===S.cat).dialog.lines[i];render();speak(ln[1]);
      setTimeout(()=>window.scrollTo({top:document.body.scrollHeight}),30);break;}
    case 'restart': S.step=0;S.revealed={};render();break;
    case 'swap': S.role=1-S.role;S.step=0;S.revealed={};render();break;
    case 'gocards': S.tab='cards';S.cat=null;S.scope='all';buildDeck();render();break;
    case 'catcards': S.tab='cards';S.scope=S.cat;S.cat=null;buildDeck();render();break;
    case 'starcards': S.tab='cards';S.scope='stars';buildDeck();render();break;
    case 'scope': S.scope=b.dataset.s;buildDeck();render();break;
    case 'flip': if(e.target.closest('[data-act="say"]'))return; S.flip=!S.flip;render();
      if(S.flip){const f=findP(S.deck[S.pos]);speak(f.p[0]);} break;
    case 'got': known.add(S.deck[S.pos]);save();S.pos++;S.flip=false;render();break;
    case 'again': known.delete(S.deck[S.pos]);save();S.deck.push(S.deck[S.pos]);S.pos++;S.flip=false;render();break;
    case 'reshuffle': buildDeck();render();break;
    case 'mic': {const f=findP(b.dataset.k);openSheet(f.p[0],f.p[1],{onDone:()=>render()});break;}
    case 'cardmic': {const k=S.deck[S.pos],f=findP(k);openSheet(f.p[0],f.p[1],{hide:true,onDone:r=>{if(r){S.flip=true;render();}}});break;}
    case 'rolemic': {const i=b.dataset.i,ln=DATA.find(x=>x.id===S.cat).dialog.lines[i];
      openSheet(ln[1],ln[2],{hide:true,onDone:r=>{if(r){S.revealed['d'+i]=1;S.revealed['s'+i]=r.pct;render();setTimeout(()=>window.scrollTo({top:document.body.scrollHeight}),30)}}});break;}
    case 'shgo': runSheet();break;
    case 'shstop': stopListen();break;
    case 'shclose': closeSheet();break;
  }
});
render();
</script>
